name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # clona el repo
      - uses: actions/setup-node@v4        # instala Node
        with:
          node-version: 20
          cache: npm
      - run: npm ci                        # instala dependencias exactas
      - run: npm run lint                  # ESLint
      - run: npm run test:run              # la SUITE completa (si falla, el check se pone rojo)
      - run: npm run build                 # verifica que compile para producción